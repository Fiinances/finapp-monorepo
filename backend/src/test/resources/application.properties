# =============================================================
# Configuração de Testes — H2 in-memory, sem Flyway
# =============================================================

# H2 in-memory substitui PostgreSQL nos testes
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

# Hibernate cria o schema a partir das entidades (sem migrations)
quarkus.hibernate-orm.database.generation=drop-and-create

# Flyway desabilitado — migrations são PostgreSQL-specific
quarkus.flyway.enabled=false

# Sem log de SQL nos testes
quarkus.hibernate-orm.log.sql=false

# JWT: sobrescreve config de produção para evitar chamada à rede
# @TestSecurity ignora verificação JWT — basta ter um valor não-nulo
mp.jwt.verify.issuer=https://test.issuer.example.com
mp.jwt.verify.audiences=authenticated
